spring.application.name=blogapp

# Load variables from a local .env file if present (KEY=VALUE lines).
# Real environment variables still take precedence over .env values.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blogapp}
spring.datasource.username=${DB_USERNAME:blogapp}
spring.datasource.password=${DB_PASSWORD:blogapp}

# JPA/Hibernate Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional admin account created on startup (skipped when ADMIN_EMAIL is empty)
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
spring.data.web.pageable.max-page-size=100
